[project]
name = "cca-phase2"
version = "0.1.0"
description = "Continuous Clinical Assurance: Phase II simulation"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn", "pandas", "pyyaml", "hydra-core", "omegaconf", "lifelines", "pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:Setting penalty=None will ignore the C and l1_ratio parameters:UserWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["archive"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["archive"]
