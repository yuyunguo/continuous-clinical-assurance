- id: R04
  source: S1
  file: nist_ai_100_1.txt
  locator: "MANAGE 4.1 (Table 4)"
  quotes: ["Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing and evaluating input from users and other relevant AI actors, appeal and override, decommissioning, incident response, recovery, and change management."]
  domains: [C, D, E]
  indicators: [H2, H3, O6, L1, L2, L4]
