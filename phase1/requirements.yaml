- id: R05
  source: S1
  file: nist_ai_100_1.txt
  locator: "MAP 3.5 (Table 2)"
  quotes: ["Processes for human oversight are defined, assessed, and documented in accordance with organizational policies from the GOVERN function."]
  domains: [C]
  indicators: [H1, H5, H7]
  measurability: capability_unmeasured
  note: Oversight must be defined and assessed. The measure of assessment is left open, which is the gap EHOR addresses.

- id: R06
  source: S1
  file: nist_ai_100_1.txt
