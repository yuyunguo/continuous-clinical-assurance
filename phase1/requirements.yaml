  quotes: ["Human judgment should be employed when deciding on the specific metrics related to AI trustworthiness characteristics and the precise threshold values for those metrics."]
  domains: [B, C]
  indicators: []
  measurability: measure_unspecified
  note: Delegates metric and threshold choice to human judgment. Consistent with the instrument's rule that margins are application-specific and set in the VOE.

